# Keeps every consumer repo's aislop fork pin in sync with schoen/main.
# Convention: a consumer repo carries .aislop/fork-commit (one line, the
# 40-char fork commit sha its CI is pinned to). This workflow bumps that pin
# everywhere on every push.
#
# Scope: consumer pins only. The aislop command each fleet machine puts on
# PATH resolves to a per-user checkout at ~/aislop, owned, installed, and
# built by the interactive user who runs it, and refreshed by that user with
# scripts/update-local-checkout.sh. CI never depends on those checkouts:
# every consumer's quality-gate job clones and builds the fork at its pinned
# sha inside the ephemeral CI workspace, so a machine's checkout being stale
# cannot affect a build.
#
# Why the install is per-user rather than one shared directory per machine:
# pnpm hard-links package files out of its content-addressable store, and on
# NTFS a hard link shares a single ACL with the store file it points at. An
# install performed by the act_runner service account out of that account's
# store yields node_modules entries the interactive user cannot read, so the
# account that installs a checkout and the account that runs aislop from it
# have to be the same one. That also keeps the two fleet machines symmetric:
# ~/aislop on each, reached through a thin wrapper (scripts/wrappers/) that
# honors an AISLOP_HOME override.
#
# Gitea only, never github.com: the push that triggers this workflow lands
# on Gitea. The GitHub mirror can lag behind it by hundreds of commits (seen
# 361 commits behind on 2026-08-22), so a clone or install that only
# resolves a sha through github.com (e.g. `github:mtschoen/aislop#<sha>`)
# can silently fail to find it, or worse, silently resolve to a stale
# commit. Every clone/fetch here targets gitea.fleet.sticktoitive.net.
#
# Required one-time setup: create a Gitea Actions secret named
# AISLOP_SYNC_TOKEN on this repository, holding a personal access token for
# the claude-code bot (scopes: write:repository, read:repository), and add
# claude-code as a write collaborator on every consumer repository this
# workflow is meant to update. This workflow does not and cannot create
# that secret or that collaborator grant itself.
on:
  push:
    branches: [schoen/main]
  workflow_dispatch:

concurrency:
  group: sync-consumers-${{ github.ref }}

permissions:
  contents: read

jobs:
  fan-out:
    name: Bump consumer repo pins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Sync consumer repos to the new fork pin
        env:
          GITEA_TOKEN: ${{ secrets.AISLOP_SYNC_TOKEN }}
        run: |
          bash scripts/sync_consumers.sh "${{ github.sha }}"
