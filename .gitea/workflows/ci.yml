# Gitea Actions in-house CI. This directory takes exclusive precedence over
# .github/workflows on Gitea: when a repo has BOTH .gitea/workflows and
# .github/workflows, Gitea Actions reads .gitea/workflows only and the
# .github/workflows directory becomes invisible to it (confirmed via
# go-gitea/gitea issue #31456, "Query both .gitea and .github for
# workflows" - filed because Gitea does NOT merge the two directories).
# GitHub itself only ever reads .github/workflows, so the two forges keep
# running independently off the same commits; nothing here affects GitHub.
#
# Deliberate omissions from .github/workflows, and why:
#   - codeql.yml: uses github/codeql-action, which uploads SARIF to
#     GitHub's code-scanning API - a GitHub-only endpoint with no Gitea
#     equivalent, so every run 404s. No Gitea file is added for it: because
#     this directory makes Gitea stop reading .github/workflows entirely,
#     Gitea already never executes codeql.yml, so there is nothing to guard.
#   - aislop.yml: its action-smoke job exercises the GitHub Marketplace
#     composite action (`uses: ./`), a GitHub-specific product surface with
#     no Gitea analogue. Its scan-smoke and quality-gate jobs duplicate the
#     substance of the quality-gate job below (`node dist/cli.js scan .` /
#     `ci .`), so nothing is lost by not porting them.
#   - contributors.yml, sync-develop.yml, release.yml: GitHub-only
#     automation (github-actions[bot] commits, `gh pr create` / auto-merge
#     against github.com, npm + GitHub Packages publish using GitHub
#     secrets). None of these are verification signals, so none are ported.
#
# Windows leg: NO actions/setup-node. actions/setup-node@v6 extracts Node's
# Windows build from a .7z archive via @actions/tool-cache, which shells out
# to a bundled 7zr.exe that exits 2 on this runner (actions/setup-node#1147)
# - every windows-latest leg that uses it fails outright, independent of
# anything in this repo. The llamabox-windows VM has one Node LTS
# preinstalled (satisfies aislop's engines.node ^22.18 || >=24.11 floor,
# which tsdown's Promise.withResolvers usage requires anyway), so the windows
# job uses that directly and does not run an OS/version matrix (there is
# only the one host Node to test against). pnpm on that leg comes from
# Corepack - bundled with Node, activated straight from package.json's
# "packageManager" pin - instead of pnpm/action-setup, so the whole leg
# needs no tool-cache archive download at all and avoids the same class of
# bug on principle, not just by avoidance of the one action that is known
# to trip it.
#
# Corepack shims go to a RUNNER_TEMP directory, not Corepack's default. Its
# default target is the directory holding the Corepack binary itself - here
# C:\Program Files\nodejs, which the unprivileged gitea-runner account
# cannot write. `corepack enable` then dies with
# "EPERM: operation not permitted, open 'C:\Program Files\nodejs\pnpx'",
# no shim is ever laid down, and the next step fails with "The term 'pnpm'
# is not recognized". `--install-directory` is the documented way to place
# the shims somewhere writable; prepending that directory to GITHUB_PATH is
# what actually puts pnpm on PATH for subsequent steps.

name: CI

on:
  push:
    branches: [schoen/main, "feat/**", "fix/**"]
  pull_request:
    branches: [schoen/main, "feat/**", "fix/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# vitest.config.ts keeps upstream's 30 s per-test timeout. This self-hosted
# runner serializes every job on one machine, so a test that takes 5 s
# unloaded (tsdown builds, multi-spawn CLI tests) can pass 30 s while the
# other legs share the box. The CLI flag overrides the config value without
# touching upstream's file; raise or lower it here, never in vitest.config.ts.
#
# When the Linux runner runs with CI egress enforcement, act_runner injects
# NODE_USE_ENV_PROXY=1 into every job container. On Node 22, Undici's
# EnvHttpProxyAgent is experimental, causing every node invocation to write
# an experimental warning to stderr (which breaks tests asserting on stderr
# output). Suppress only that warning while preserving the runner-provided
# proxy routing for Node requests.
env:
  VITEST_TEST_TIMEOUT_MS: "90000"
  NODE_OPTIONS: "--disable-warning=UNDICI-EHPA"

permissions:
  contents: read

jobs:
  # Gitea commit-status writes are authorized through the Code unit. A
  # job-level contents:write grant keeps that permission away from every
  # other CI job while allowing this job to post pr-crew/coverage.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Detect toolchain baked into the runner image
        id: baked
        shell: bash
        run: bash ci/baked-toolchain.sh node

      - uses: actions/setup-node@v6
        if: steps.baked.outputs.node != 'true'
        with:
          # 22.23.3 exactly: Node 22 is a named fleet alternate for this repo
          # only (upstream rejected single-version CI), and the fleet image
          # toolcache carries 22.23.3 so setup-node resolves it offline.
          node-version: 22.23.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --prefer-offline --frozen-lockfile

      - name: Measure coverage
        run: pnpm test:coverage --testTimeout=${{ env.VITEST_TEST_TIMEOUT_MS }}

      - name: Post coverage status
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/post-coverage-status.py --cobertura "coverage/cobertura-coverage.xml"

  test-ubuntu:
    name: Build & test (ubuntu-latest, node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.23.3, 24]
    env:
      NODE_OPTIONS: "--disable-warning=UNDICI-EHPA"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --prefer-offline --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm vitest run --testTimeout=${{ env.VITEST_TEST_TIMEOUT_MS }}

  test-windows:
    name: Build & test (windows-latest, host node)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify host Node satisfies the engines.node supported range
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $detectedVersion = node --version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "node --version failed with exit code $LASTEXITCODE; cannot verify package.json engines.node."
            exit 1
          }
          $detectedVersion = "$detectedVersion".Trim()
          Write-Host $detectedVersion
          $nodeVersion = [System.Management.Automation.SemanticVersion]($detectedVersion.TrimStart("v"))
          $requiredRange = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).engines.node
          # Keep these bounded intervals aligned with package.json and its manifest drift test.
          $supported = -not $nodeVersion.PreReleaseLabel -and (
            ($nodeVersion -ge [semver]'22.18.0' -and $nodeVersion -lt [semver]'23.0.0') -or
            $nodeVersion -ge [semver]'24.11.0'
          )
          if (-not $supported) {
            Write-Error "Host Node $detectedVersion does not satisfy package.json engines.node '$requiredRange'; the preinstalled runner Node needs upgrading."
            exit 1
          }

      - name: Activate pnpm via Corepack (no tool-cache archive download)
        shell: pwsh
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          if (-not (Get-Command corepack -ErrorAction SilentlyContinue)) {
            # Recent Node builds ship without Corepack bundled; fall back to
            # a plain npm registry install (still no archive extraction).
            npm install -g corepack
          }
          $shimDirectory = Join-Path $env:RUNNER_TEMP 'corepack-shims'
          New-Item -ItemType Directory -Force -Path $shimDirectory | Out-Null
          corepack enable --install-directory $shimDirectory
          corepack prepare --activate
          Add-Content -Path $env:GITHUB_PATH -Value $shimDirectory
          # Fail loudly here rather than as a confusing "'pnpm' is not
          # recognized" three steps later.
          $pnpmShim = Join-Path $shimDirectory 'pnpm.cmd'
          if (-not (Test-Path $pnpmShim)) {
            Write-Error "Corepack laid down no pnpm shim in $shimDirectory"
            exit 1
          }
          & $pnpmShim --version

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        shell: pwsh
        run: pnpm typecheck

      - name: Build
        shell: pwsh
        run: pnpm build

      - name: Test
        shell: pwsh
        run: pnpm vitest run --testTimeout=${{ env.VITEST_TEST_TIMEOUT_MS }}

  # Stable gate over both OS legs. always() + an explicit result check is
  # deliberate: a gate that merely skips when a leg fails would otherwise
  # report success itself, letting a red matrix look green downstream.
  check:
    name: Build & test
    needs: [test-ubuntu, test-windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both legs to pass
        run: |
          if [ "${{ needs.test-ubuntu.result }}" != "success" ] || [ "${{ needs.test-windows.result }}" != "success" ]; then
            echo "test-ubuntu: ${{ needs.test-ubuntu.result }}"
            echo "test-windows: ${{ needs.test-windows.result }}"
            exit 1
          fi
          echo "All Build & test legs passed."

  quality-gate:
    name: Quality gate
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Detect toolchain baked into the runner image
        id: baked
        shell: bash
        run: bash ci/baked-toolchain.sh node

      - uses: actions/setup-node@v6
        if: steps.baked.outputs.node != 'true'
        with:
          node-version: 22.23.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --prefer-offline --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify config schema
        run: |
          pnpm gen:schema
          git diff --exit-code schema/aislop.config.schema.json

      - name: Provision lint tools from runner tool store
        run: |
          EXPECTED_RUFF_VERSION="$(node scripts/read-tool-pin.mjs ruff)"
          EXPECTED_GOLANGCI_VERSION="$(node scripts/read-tool-pin.mjs golangci-lint)"

          ruff_version_matches() {
            [[ "$1" =~ ^ruff[[:space:]]+([^[:space:]]+) ]] &&
              [[ "${BASH_REMATCH[1]}" == "$EXPECTED_RUFF_VERSION" ]]
          }

          golangci_version_matches() {
            [[ "$1" =~ ^golangci-lint[[:space:]]+has[[:space:]]+version[[:space:]]+([^[:space:]]+) ]] &&
              [[ "${BASH_REMATCH[1]}" == "$EXPECTED_GOLANGCI_VERSION" ]]
          }

          mkdir -p tools/bin
          # Gitea jobs must not download tools from the public internet.
          # Resolve ruff and golangci-lint from runner-baked paths or the
          # mounted tool store (/opt/hostedtoolcache) matching pinned versions.

          resolved_ruff=""
          if command -v ruff >/dev/null 2>&1; then
            if current_ver="$(ruff --version 2>&1)" && ruff_version_matches "$current_ver"; then
              resolved_ruff="$(command -v ruff)"
            fi
          fi

          if [ -z "$resolved_ruff" ]; then
            for candidate in \
              /opt/hostedtoolcache/node/*/x64/lib/node_modules/aislop/tools/bin/ruff \
              /opt/hostedtoolcache/Python/*/x64/bin/ruff \
              /opt/fleet/python-*/bin/ruff \
              /usr/local/bin/ruff \
              /usr/bin/ruff; do
              if [ -x "$candidate" ]; then
                if ver="$("$candidate" --version 2>&1)" && ruff_version_matches "$ver"; then
                  resolved_ruff="$candidate"
                  break
                fi
              fi
            done
          fi

          if [ -n "$resolved_ruff" ]; then
            echo "Provisioning ruff from $resolved_ruff"
            ln -sf "$resolved_ruff" tools/bin/ruff
          fi

          resolved_golangci=""
          if command -v golangci-lint >/dev/null 2>&1; then
            if current_ver="$(golangci-lint version 2>&1)" && golangci_version_matches "$current_ver"; then
              resolved_golangci="$(command -v golangci-lint)"
            fi
          fi

          if [ -z "$resolved_golangci" ]; then
            for candidate in \
              /opt/hostedtoolcache/node/*/x64/lib/node_modules/aislop/tools/bin/golangci-lint \
              /usr/local/bin/golangci-lint \
              /usr/bin/golangci-lint; do
              if [ -x "$candidate" ]; then
                if ver="$("$candidate" version 2>&1)" && golangci_version_matches "$ver"; then
                  resolved_golangci="$candidate"
                  break
                fi
              fi
            done
          fi

          if [ -n "$resolved_golangci" ]; then
            echo "Provisioning golangci-lint from $resolved_golangci"
            ln -sf "$resolved_golangci" tools/bin/golangci-lint
          fi

          if [ -d "$PWD/tools/bin" ]; then
            echo "$PWD/tools/bin" >> "$GITHUB_PATH"
            export PATH="$PWD/tools/bin:$PATH"
          fi

          # Verify Ruff is available and matches the pinned version
          if ! ruff_ver="$(ruff --version 2>&1)" || ! ruff_version_matches "$ruff_ver"; then
            echo "Error: ruff version command failed or '$ruff_ver' does not match pinned version '$EXPECTED_RUFF_VERSION'" >&2
            exit 1
          fi
          echo "Resolved ruff version: $ruff_ver"

          # Verify golangci-lint is available and matches the pinned version
          if ! golangci_ver="$(golangci-lint version 2>&1)" || ! golangci_version_matches "$golangci_ver"; then
            echo "Error: golangci-lint version command failed or '$golangci_ver' does not match pinned version '$EXPECTED_GOLANGCI_VERSION'" >&2
            exit 1
          fi
          echo "Resolved golangci-lint version: $golangci_ver"

      - name: aislop ci
        run: node dist/cli.js ci .

  dotnet-lint:
    name: C# lint integration
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Detect toolchain baked into the runner image
        id: baked
        shell: bash
        run: bash ci/baked-toolchain.sh node

      - uses: actions/setup-node@v6
        if: steps.baked.outputs.node != 'true'
        with:
          node-version: 22.23.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --prefer-offline --frozen-lockfile

      # The .NET SDK, jb, and roslynator come from the fleet Linux image (schoen-lab#4135).
      - name: Print baked .NET SDK and analyzer versions
        run: |
          dotnet --version
          jb inspectcode --version
          roslynator --version

      - name: Build
        run: pnpm build

      # Reject an unrestored control, then require both analyzers to run the restored
      # fixture and emit its exact diagnostic. Findings may make a valid scan exit 1.
      - name: Validate C# analyzer execution
        run: |
          node --input-type=commonjs <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const { spawnSync } = require("node:child_process");

          const projectRoot = "tests/fixtures/dotnet/sample-project";
          const projectFile = `${projectRoot}/Sample.csproj`;
          const assetsFile = `${projectRoot}/obj/project.assets.json`;
          const tools = ["jb inspectcode", "roslynator"];

          const run = (phase, command, arguments_) => {
            console.log(`\n[${phase}] ${command} ${arguments_.join(" ")}`);
            const result = spawnSync(command, arguments_, { encoding: "utf8" });
            if (result.stdout) process.stdout.write(result.stdout);
            if (result.stderr) process.stderr.write(result.stderr);
            console.log(`\n[${phase}] exit status: ${result.status}; signal: ${result.signal ?? "none"}`);
            assert.ifError(result.error);
            assert.equal(result.signal, null, `${phase}: process terminated by signal`);
            assert.notEqual(result.status, null, `${phase}: process produced no exit status`);
            return result;
          };

          const scan = (phase) => {
            const result = run(phase, process.execPath, [
              "dist/cli.js",
              "scan",
              projectRoot,
              "--json",
            ]);
            assert.equal(typeof result.stdout, "string", `${phase}: missing stdout`);
            assert.ok(result.stdout.trim(), `${phase}: empty JSON report`);
            let report;
            try {
              report = JSON.parse(result.stdout);
            } catch (error) {
              assert.fail(`${phase}: invalid JSON report: ${error.message}`);
            }
            return { result, report };
          };

          const validatePositive = (result, report) => {
            assert.ok(result.status === 0 || result.status === 1, `unexpected scan exit ${result.status}`);
            assert.ok(report && typeof report === "object" && !Array.isArray(report));
            assert.equal(report.schemaVersion, "2");
            assert.ok(report.engines && typeof report.engines === "object" && !Array.isArray(report.engines));
            for (const [name, engine] of Object.entries(report.engines)) {
              assert.ok(engine && typeof engine === "object" && !Array.isArray(engine), `${name}: invalid engine`);
              assert.notEqual(engine.failed, true, `${name}: engine failed`);
              for (const field of ["failures", "missingTools"]) {
                assert.ok(
                  engine[field] === undefined || (Array.isArray(engine[field]) && engine[field].length === 0),
                  `${name}: nonempty or invalid ${field}`,
                );
              }
            }

            const lint = report.engines.lint;
            assert.ok(lint && typeof lint === "object" && !Array.isArray(lint), "missing lint engine");
            assert.equal(lint.skipped, false);
            assert.notEqual(lint.failed, true);
            assert.ok(Array.isArray(lint.executions), "missing analyzer executions");
            assert.equal(lint.executions.length, 2);
            for (const tool of tools) {
              const matching = lint.executions.filter((execution) => execution.tool === tool);
              assert.equal(matching.length, 1, `${tool}: expected one execution record`);
              const execution = matching[0];
              assert.equal(execution.status, "ran", `${tool}: ${execution.reason ?? execution.status}`);
              for (const field of ["targets", "analyzedProjects", "excludedProjects"]) {
                assert.ok(Array.isArray(execution[field]), `${tool}: missing ${field}`);
              }
              assert.ok(execution.targets.includes("Sample.csproj"), `${tool}: fixture not targeted`);
              assert.ok(execution.analyzedProjects.includes("Sample.csproj"), `${tool}: fixture not analyzed`);
              assert.ok(!execution.excludedProjects.includes("Sample.csproj"), `${tool}: fixture excluded`);
            }
            assert.ok(Array.isArray(report.diagnostics), "missing diagnostics");
            assert.ok(
              report.diagnostics.some((diagnostic) =>
                diagnostic.engine === "lint" && diagnostic.filePath === "Bad.cs" &&
                diagnostic.rule === "dotnet/AsyncFixer03"
              ),
              "expected dotnet/AsyncFixer03 in Bad.cs",
            );
          };

          assert.equal(fs.existsSync(assetsFile), false, `${assetsFile} must be absent before the negative control`);
          const negative = scan("pre-restore");
          assert.equal(negative.result.status, 1, "unrestored scan must exit 1");
          assert.equal(negative.report.schemaVersion, "2");
          const negativeLint = negative.report.engines?.lint;
          assert.ok(negativeLint && typeof negativeLint === "object", "negative control missing lint engine");
          assert.equal(negativeLint.skipped, false);
          assert.equal(negativeLint.failed, true, "unrestored lint engine must fail");
          assert.ok(Array.isArray(negativeLint.executions), "negative control missing executions");
          assert.equal(negativeLint.executions.length, 2);
          for (const tool of tools) {
            const matching = negativeLint.executions.filter((execution) => execution.tool === tool);
            assert.equal(matching.length, 1, `${tool}: expected one negative execution record`);
            assert.equal(matching[0].status, "not-selected", `${tool}: unrestored analyzer must not run`);
            assert.ok(Array.isArray(matching[0].analyzedProjects), `${tool}: missing analyzedProjects`);
            assert.equal(matching[0].analyzedProjects.length, 0, `${tool}: unrestored project analyzed`);
          }
          assert.ok(Array.isArray(negative.report.diagnostics), "negative control missing diagnostics");
          assert.ok(
            negative.report.diagnostics.some((diagnostic) =>
              diagnostic.engine === "lint" && diagnostic.rule === "dotnet/projects-skipped"
            ),
            "negative control missing projects-skipped advisory",
          );
          assert.throws(
            () => validatePositive(negative.result, negative.report),
            "positive acceptance unexpectedly passed the unrestored report",
          );
          console.log("[pre-restore] positive acceptance rejected the unrestored report");

          const restore = run("locked restore", "dotnet", ["restore", projectFile, "--locked-mode"]);
          assert.equal(restore.status, 0, "dotnet restore failed");
          const build = run("no-restore build", "dotnet", ["build", projectFile, "--no-restore"]);
          assert.equal(build.status, 0, "dotnet build failed");
          assert.equal(fs.existsSync(assetsFile), true, `${assetsFile} missing after restore`);

          const positive = scan("post-build");
          validatePositive(positive.result, positive.report);
          console.log("[post-build] both analyzers ran Sample.csproj and emitted dotnet/AsyncFixer03");
          NODE
